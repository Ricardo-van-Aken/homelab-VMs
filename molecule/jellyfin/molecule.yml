---
# Inherits .config/molecule/config.yml. Docker runs inside the instance
# (privileged, systemd), so the compose stack is really started.
scenario:
  name: jellyfin
platforms:
  - name: instance
    image: ${MOLECULE_TARGET_IMAGE:-molecule-target:local}
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # The inner daemon cannot layer overlayfs on the instance's own
      # overlayfs root; give it a real volume for its storage.
      - /var/lib/docker
provisioner:
  inventory:
    group_vars:
      all:
        jellyfin_media_path: /srv/media
