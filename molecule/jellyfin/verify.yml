---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Inspect Jellyfin container
      community.docker.docker_container_info:
        name: jellyfin
      register: jellyfin_info

    - name: Assert Jellyfin is running with GPU access
      ansible.builtin.assert:
        that:
          - jellyfin_info.exists
          - jellyfin_info.container.State.Running
          - jellyfin_info.container.HostConfig.Devices | selectattr('PathOnHost', 'eq', '/dev/dri') | list | length == 1

    - name: Wait for the web UI
      ansible.builtin.uri:
        url: http://127.0.0.1:8096/health
        status_code: 200
      register: jellyfin_health
      retries: 30
      delay: 5
      until: jellyfin_health.status == 200
