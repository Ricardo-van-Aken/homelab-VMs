# The shape of credentials.sops.yaml, which holds the real values encrypted.
# Terraform uses these to log in and never writes them to its state.

# API token of the Hetzner Cloud project, with read and write access.
hcloud_token: replace-me
# The project's S3 credentials, made in the Hetzner console.
s3_access_key: replace-me
s3_secret_key: replace-me
