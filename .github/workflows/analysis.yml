---
name: Analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ansible-analysis
      context: docker/analysis

  lint:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The runner mounts its workspace into the container and writes step
      # files there; the image's UID 1000 cannot, so job containers run as root.
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - run: ansible-lint --strict
