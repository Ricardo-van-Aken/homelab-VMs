---
name: Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ansible-analysis
      context: ansible
      dockerfile: ansible/docker/analysis/Dockerfile
      hash_paths: ansible/docker/analysis ansible/requirements.yml

  lint:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The runner mounts its workspace into the container and writes step
      # files there; the image's UID 1000 cannot, so job containers run as root.
      options: --user root
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Lint YAML repo-wide
        run: yamllint --strict "$GITHUB_WORKSPACE"

      - name: Lint Ansible
        run: ansible-lint --strict

      - name: Syntax check
        run: ansible-playbook --syntax-check playbooks/site.yml
