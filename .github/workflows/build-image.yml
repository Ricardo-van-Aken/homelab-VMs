---
name: Build image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/<repo>/, e.g. ansible-analysis
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile, e.g. docker/analysis/Dockerfile
        required: true
        type: string
      hash_paths:
        description: >-
          Space-separated files and directories whose content defines the
          image tag. Must cover every path the Dockerfile reads.
        required: true
        type: string
      context:
        description: Build context; root .dockerignore limits what it exposes
        required: false
        type: string
        default: .
      target:
        description: Dockerfile stage to build (optional)
        required: false
        type: string
        default: ''
    outputs:
      image:
        description: Full image reference, ghcr.io/<repo>/<image>:<tag>
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The tag is a hash over git's own object ids of every input path (a
      # tree id for a directory, a blob id for a file), so the same content
      # always yields the same tag and a change in any input yields a new one.
      - name: Derive image reference from input content
        id: ref
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/${{ inputs.image }}"
          tag=$(for p in ${{ inputs.hash_paths }}; do git rev-parse "HEAD:${p}"; done | sort | git hash-object --stdin)
          echo "image=${repo}:${tag}" >> "$GITHUB_OUTPUT"
          echo "cache=${repo}:buildcache" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this content is already built
        id: exists
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Reusing ${{ steps.ref.outputs.image }}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Cache export needs the container builder; the default docker driver
      # cannot write a registry cache.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        if: steps.exists.outputs.found == 'false'

      # One layer cache per image, stored beside it in the registry. mode=max
      # also keeps the builder stages, which the final stages only copy from.
      - name: Build and push
        if: steps.exists.outputs.found == 'false'
        run: |
          docker buildx build \
            --file "${{ inputs.dockerfile }}" \
            ${{ inputs.target && format('--target {0}', inputs.target) || '' }} \
            --cache-from "type=registry,ref=${{ steps.ref.outputs.cache }}" \
            --cache-to "type=registry,ref=${{ steps.ref.outputs.cache }},mode=max" \
            --tag "${{ steps.ref.outputs.image }}" \
            --push \
            "${{ inputs.context }}"
