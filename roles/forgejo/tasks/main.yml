---
- name: Create Forgejo service account
  ansible.builtin.user:
    name: "{{ forgejo_user }}"
    uid: "{{ forgejo_uid }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create stacks directory
  ansible.builtin.file:
    path: "{{ docker_stacks_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Forgejo directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_user }}"
    mode: "0750"
  loop:
    - "{{ forgejo_dir }}"
    - "{{ forgejo_dir }}/data"

- name: Render compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ forgejo_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Forgejo stack
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_dir }}"
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 120

- name: Create initial admin user
  when: forgejo_admin_password | length > 0
  block:
    - name: List admin users
      community.docker.docker_container_exec:
        container: forgejo
        user: git
        command: forgejo admin user list --admin
      register: forgejo_admins
      changed_when: false

    - name: Create admin user
      community.docker.docker_container_exec:
        container: forgejo
        user: git
        command: >-
          forgejo admin user create --admin --must-change-password=false
          --username {{ forgejo_admin_user | quote }}
          --password {{ forgejo_admin_password | quote }}
          --email {{ forgejo_admin_email | quote }}
      when: forgejo_admin_user not in forgejo_admins.stdout
      changed_when: true
      no_log: true
