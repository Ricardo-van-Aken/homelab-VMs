---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

# The unit is static (udev-activated) and depends on the virtio serial
# device, which only a QEMU guest has, so it is started, never enabled.
- name: Start QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started
  when: ansible_facts.virtualization_type in ['kvm', 'qemu']

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
