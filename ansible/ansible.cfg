[defaults]
inventory = inventory/hosts.yml
# Local Galaxy installs first, then the project's role directories (Ansible
# does not nest roles, so each group is a path).
roles_path = galaxy_roles:roles/proxmox:roles/common:roles/services:/opt/venv/share/ansible/roles
collections_path = collections:/opt/venv/share/ansible/collections
# *.sops.yaml files in group_vars and host_vars, the secrets, are decrypted
# with SOPS. After host_group_vars, so the decrypted values win.
vars_plugins_enabled = host_group_vars,community.sops.sops
interpreter_python = auto_silent
result_format = yaml
retry_files_enabled = false

[galaxy]
role_file = requirements.yml

[privilege_escalation]
become = true
