[defaults]
inventory = inventory/hosts.yml
# Local Galaxy installs first, then the project's role directories (Ansible
# does not nest roles, so each group is a path).
roles_path = galaxy_roles:roles/proxmox:roles/common:roles/services:/opt/venv/share/ansible/roles
collections_path = collections:/opt/venv/share/ansible/collections
interpreter_python = auto_silent
result_format = yaml
retry_files_enabled = false

[galaxy]
role_file = requirements.yml

[privilege_escalation]
become = true
