[defaults]
inventory = inventory/hosts.yml
# Local Galaxy installs first, then the project, then the paths baked into
# the container images.
roles_path = galaxy_roles:roles:/opt/venv/share/ansible/roles
collections_path = collections:/opt/venv/share/ansible/collections
interpreter_python = auto_silent
result_format = yaml
retry_files_enabled = false

[galaxy]
role_file = requirements.yml

[privilege_escalation]
become = true
