---
# Galaxy roles and collections. Exact pins: these are baked into the runtime
# and analysis images, whose tags are derived from this file's content.
#
# Roles come from git by commit, since Galaxy role versions are git tags and
# tags can move. Collection versions are immutable once published to Galaxy.
roles:
  - name: geerlingguy.docker
    src: https://github.com/geerlingguy/ansible-role-docker.git
    scm: git
    version: 1d3968dbf0df48515ffda0f6561cbd25206f502a  # 8.0.0

collections:
  - name: community.docker
    version: 5.3.0
  - name: community.general
    version: 13.4.0
  - name: ansible.posix
    version: 2.2.2
