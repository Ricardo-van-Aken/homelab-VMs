---
# Pi-hole settings.

# Names follow the inventory: each machine as its inventory name under the
# domain (forgejo-git.zeepaardje98.eu), each service as its group name
# (forgejo.zeepaardje98.eu), or as <machine>.<service> when it runs on
# several machines, so every name points at one address.
pihole_records: >-
  {%- set records = [] -%}
  {%- for host in groups['vms'] + (groups['pis'] | default([])) -%}
    {%- set names = [host] -%}
    {%- for service in hostvars[host].group_names | difference(['vms', 'pis']) -%}
      {%- set _ = names.append(service if groups[service] | length == 1 else host ~ '.' ~ service) -%}
    {%- endfor -%}
    {%- set _ = records.append(hostvars[host].ansible_host ~ ' '
                               ~ (names | map('regex_replace', '$', '.' ~ homelab_domain) | join(' '))) -%}
  {%- endfor -%}
  {{ records }}

# Admin UI, through Caddy; one name per instance.
pihole_domain: "{{ inventory_hostname }}.pihole.{{ homelab_domain }}"

