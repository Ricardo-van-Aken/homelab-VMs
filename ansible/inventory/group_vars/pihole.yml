---
# Pi-hole settings. The LAN uses it once the router's DHCP hands out the dns
# VM's address as the nameserver.

# Names follow the inventory. A VM is reachable as its inventory name under
# the domain (forgejo-git.zeepaardje98.eu), and each service as the
# name of its group (forgejo.zeepaardje98.eu), both pointing at the VM's
# address.
#
# The loop below reads the hosts in the vms group and their groups, so a
# new VM or service in hosts.yml gets its names without an edit here.
pihole_records: >-
  {%- set records = [] -%}
  {%- for host in groups['vms'] -%}
    {%- set names = [host] + (hostvars[host].group_names | reject('equalto', 'vms') | list) -%}
    {%- set _ = records.append(hostvars[host].ansible_host ~ ' '
                               ~ (names | map('regex_replace', '$', '.' ~ homelab_domain) | join(' '))) -%}
  {%- endfor -%}
  {{ records }}

