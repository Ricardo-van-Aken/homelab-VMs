---
# Minecraft settings.

# Mojang's End User License Agreement, https://aka.ms/MinecraftEULA.
# TODO: read it and set to true to agree; the role stops while it is false.
minecraft_eula: true

minecraft_motd: L.A.N party
# Sized for 20 to 30 players. The VM's memory is 2 GB above the limit, for
# Ubuntu, the backups and Caddy.
minecraft_max_players: 30
minecraft_memory: 7G
minecraft_memory_limit: 8g
# How far around each player mobs and crops move; the default is 10. The
# main game loop runs on one core, and this is its biggest cost.
minecraft_extra_env:
  SIMULATION_DISTANCE: "6"
# A new name starts a new world; the old one stays on the disk.
minecraft_world: world2
minecraft_seed: "-8028949898700072581"
# A new world's border: 1500 blocks from 0,0 in every direction. Changed on
# the running server afterwards (docs/minecraft.md).
minecraft_world_radius: 1500
# A new world's game rules; changed on the running server afterwards.
minecraft_gamerules:
  players_sleeping_percentage: 66  # of the players asleep skips the night

# Java players who may join and who may run commands from the first start.
# Everyone else is added on the running server (docs/minecraft.md).
minecraft_whitelist: []
minecraft_ops: []

# Mod settings, in place before the world is created. Structurify: how far
# apart Terralith's and Towns and Towers' structures are.
minecraft_config_files:
  - src: "{{ inventory_dir }}/files/minecraft/structurify.json"
    dest: structurify.json

# The map's certificate: Let's Encrypt connects to the machine itself, so
# the DNS provider's token stays off a machine the internet reaches.
caddy_challenge: direct

# Backups to the bucket terraform/stacks/minecraft makes (its output
# backup_repository). Every server here backs up to it, and one without a
# world loads the newest backup from it.
minecraft_backup_repository: s3:https://fsn1.your-objectstorage.com/minecraft-backups-24de02e1
minecraft_backup_region: fsn1
minecraft_backup_interval: 15m
# Kept: the last 96 (a day of play), then one an hour, a day and a week.
minecraft_backup_retention: --keep-last 96 --keep-hourly 48 --keep-daily 14 --keep-weekly 8
# The bucket's S3 credentials; OpenTofu makes the bucket with them.
# SECRET: in secrets.sops.yaml.
# minecraft_backup_access_key_id: <string>
# minecraft_backup_secret_access_key: <string>

# Encrypts the backups. Any long random string; save it in a password
# manager, because without it no backup can be read.
# SECRET: in secrets.sops.yaml.
# minecraft_backup_password: <string, no single quotes>
