---
# Settings shared by every Raspberry Pi.
ansible_user: zeepaardje  # the user chosen in Raspberry Pi Imager
# Accept a host key on first contact, but still refuse a changed one.
ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new

# The fixed address, or the one a fresh Pi still has, passed once with
# `-e static_address_current=<address>`; role static_address then moves it.
ansible_host: "{{ static_address_current | default(static_address_ip) }}"
static_address_prefix: 24
static_address_gateway: 10.0.1.1
# The dns VM; the router does not answer DNS itself.
static_address_dns: ["10.0.1.100"]

# Firewall (role host_firewall). The VPN is published by Docker and passes
# by this firewall; Caddy and Pi-hole, on the host's network, do not.
host_firewall_lan: "{{ homelab_lan }}"
host_firewall_admin: "{{ homelab_admin }}"
host_firewall_monitoring: "{{ homelab_monitoring }}"
host_firewall_in:
  - proto: udp
    port: 53  # DNS, Pi-hole
  - proto: tcp
    port: 53  # DNS over TCP, Pi-hole
  - proto: udp
    port: 67  # DHCP, Pi-hole; clients have no address yet
    from: any
  - proto: tcp
    port: 80  # HTTP, redirected to HTTPS by Caddy
  - proto: tcp
    port: 443  # Pi-hole admin and wg-easy web UIs, through Caddy
