---
# WireGuard (wg-easy) settings. Each instance has its own clients.
wireguard_domain: "{{ inventory_hostname }}.wireguard.{{ homelab_domain }}"
# The Pi-holes, so homelab names resolve through the tunnel; the VM first,
# the Pi as fallback.
wireguard_client_dns: ["10.0.1.100", "10.0.1.101"]

# Set on an instance's first start, so wg-easy skips its setup screen. The
# public host is a public DNS record pointing at your public IP address.
wireguard_admin_user: admin
wireguard_public_host: "wg-easy.{{ homelab_domain }}"
