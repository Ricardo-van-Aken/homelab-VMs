---
# Settings shared by every machine.
base_timezone: Europe/Amsterdam

# Public keys that may log in as `ansible_user` on every machine (role
# ssh_keys). group_vars/proxmox.yml hands the same list to cloud-init, and
# OpenTofu puts them on a rented server, named after the comment at the end
# of each key, so every key needs one.
# SECRET: in identity.sops.yaml; the comments say whose keys they are.
# ssh_keys_authorized: <list of "ssh-ed25519 <key> <comment>">

# Services are reached as <service>.<domain>, machines as <name>.<domain>.
# SECRET: in identity.sops.yaml.
# homelab_domain: <domain name>

# Public IPv4 address of the home network.
# SECRET: in identity.sops.yaml.
# homelab_public_address: <IPv4 address>

# Firewalls (roles pve_firewall, host_firewall): the LAN, and the machines
# that may SSH into every machine and open the Proxmox web UI.
homelab_lan: 10.0.1.0/24
homelab_admin: ["{{ homelab_lan }}"]

# Monitoring: the address of the machine that collects metrics and logs
# (group grafana), the port every machine's agent answers on, and the port
# on the monitoring machine the logs go to. Firewalls and the egress VMs
# take all three from here.
homelab_monitoring: "{{ hostvars[groups['grafana'] | first].ansible_host }}"
alloy_port: 9100
grafana_logs_port: 3100

# One token per machine with an agent (role alloy), by inventory name. The
# agent sends it with its logs; the monitoring VM files them by it.
# SECRET: in secrets.sops.yaml.
# homelab_monitoring_tokens:
#   <machine>: <32 characters or more, of letters, digits and . _ ~ + / = ->

# Where every machine's agent sends its logs, and the token it sends.
alloy_logs_url: "http://{{ homelab_monitoring }}:{{ grafana_logs_port }}/loki/api/v1/push"
alloy_token: "{{ (homelab_monitoring_tokens | default({}))[inventory_hostname] | default('') }}"

# HTTPS for the web UIs (role caddy).
caddy_https: true
# The provider hosting the domain's DNS records: its Caddy module name and
# the plugin providing it (github.com/caddy-dns).
caddy_dns_provider: hetzner
caddy_dns_plugin: github.com/caddy-dns/hetzner/v2@v2.0.0
# Let's Encrypt account for the certificates.
# SECRET: in secrets.sops.yaml.
# caddy_acme_email: <email address>

# API token of that provider that may change the domain's records.
# SECRET: in secrets.sops.yaml.
# caddy_dns_token: <string>
