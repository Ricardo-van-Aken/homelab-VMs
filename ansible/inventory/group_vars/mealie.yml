# Mealie settings.
# The service name the dns VM resolves (see group_vars/pihole.yml).
mealie_domain: "mealie.{{ homelab_domain }}"
# Recipes, images and database, on the host's mealie dataset (pve_vm.shares).
mealie_data_dir: /srv/mealie
mealie_http_port: 9925

# LAN only: anyone who can reach the VM reads the recipes at
# <mealie_url>/g/home without an account.
mealie_public: true

