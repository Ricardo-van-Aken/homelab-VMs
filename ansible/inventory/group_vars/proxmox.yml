---
# Settings shared by every Proxmox host. Proxmox has no sudo; connect as root.
ansible_user: root
ansible_become: false
# Accept the host key on first contact (the container starts with an empty
# known_hosts), but still refuse a changed one.
ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new

# Cloud-init template that VMs are cloned from (role pve_template).
pve_template_vmid: 1000
pve_template_name: ubuntu-26.04-cloudimg
pve_template_storage: local-lvm
pve_template_bridge: vmbr0
pve_template_disk_size: 20G
# Public keys cloud-init installs for the `ubuntu` user on every clone: the
# same list the ssh_keys role puts on every machine.
pve_template_ssh_keys: "{{ ssh_keys_authorized }}"

# Network the VMs are on (role pve_vms). Each VM gets a static address via
# cloud-init (determined by `ansible_host` in their corresponding
# host_vars/<vmname>.yml), with this prefix length and gateway.
pve_vms_network_prefix: 24
pve_vms_gateway: 10.0.1.1
# The Pi-holes, the VM first and the Pi as fallback.
pve_vms_nameservers: >-
  {{ ((groups['vms'] | intersect(groups['pihole']))
      + (groups['pis'] | default([]) | intersect(groups['pihole'])))
     | map('extract', hostvars, 'ansible_host') | list }}

# Bridges without a physical port or host address (role pve_network), one
# per isolated VM; each one's only way out is its own egress VM. Named after
# that egress VM's last octet: egress 10.0.1.225 serves vmbr225 and
# 10.250.225.0/24. Lower numbers are kept for networks that are not isolated.
pve_network_isolated_bridges: [vmbr225, vmbr226]

# Firewall (role pve_firewall). Each VM's rules are `firewall` in its pve_vm.
pve_firewall_lan: "{{ homelab_lan }}"
pve_firewall_admin: "{{ homelab_admin }}"
pve_firewall_dns: "{{ pve_vms_nameservers }}"
pve_firewall_monitoring: "{{ homelab_monitoring }}"
