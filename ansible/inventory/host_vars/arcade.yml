---
# Configuration of the VM. Service settings live in group_vars/<service>.yml.
ansible_host: 10.0.1.160

# The VM as the Proxmox host builds it.
# Its VMID is the 8 bits of its IP on our LAN (= ansible_host: 160). There
# is no hard requirement to do this, it is just personal preference.
pve_vm:
  cores: 8
  memory: 16384
  balloon: 4096  # reserved; the rest is given back when idle
  bios: ovmf   # the passed-through card is the guest's display; it wants UEFI
  vga: none
  hostpci:
    - 0000:84:00,pcie=1,x-vga=1  # Radeon R9 380X, both functions
  # The GPU has no function-level reset: a restart can crash the VM. Changes
  # need to wait until we can cold power cycle the host.
  restart_on_change: false
  # Host datasets (pve_storage on srv1) mounted with virtiofs.
  shares:
    - dataset: movies
      path: /srv/media/movies
    - dataset: music
      path: /srv/media/music
    - dataset: series
      path: /srv/media/series
    - dataset: games
      path: /srv/games
  # Jellyfin: web UI, the apps' port, client discovery and DLNA. Sunshine:
  # pairing, control and RTSP over TCP; video, audio and input over UDP;
  # mDNS so Moonlight finds it.
  firewall:
    in:
      - proto: tcp
        port: 80,443,8096
      - proto: udp
        port: 1900,7359
      - proto: tcp
        port: 47984,47989,48010
      - proto: udp
        port: 47998:48000,48002,48010,5353

# Vendors of the GPUs in this VM (hostpci above): any of amd, intel, nvidia.
# Which GPU each service uses is set in group_vars/<service>.yml.
gpu_vendors: [amd]
