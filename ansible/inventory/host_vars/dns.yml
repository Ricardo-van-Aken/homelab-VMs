---
# Facts about this machine. Service settings live in group_vars/<service>.yml.
ansible_host: 10.0.1.100

# The VM as the Proxmox host builds it.
# Its VMID is the 8 bits of its IP on our LAN (= ansible_host: 100). There
# is no hard requirement to do this, it is just personal preference.
pve_vm:
  cores: 1
  memory: 1024
  balloon: 512  # kept at least; the rest is given back when idle
  # Public resolvers: this VM is the resolver the others use.
  nameservers:
    - 1.1.1.1
    - 1.0.0.1
  # DNS and the web UIs for the LAN, the VPN for the internet. VPN clients
  # come out of this VM, so it may reach the whole LAN.
  firewall:
    in:
      - proto: udp
        port: 53
      - proto: tcp
        port: 53,80,443
      - proto: udp
        port: 51820
        from: any
    lan: all
