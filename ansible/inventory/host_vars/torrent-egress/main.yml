---
# Facts about this machine. Service settings live in group_vars/<service>.yml.
# The torrent VM's only way in and out.
ansible_host: 10.0.1.225

# The VM as the Proxmox host builds it.
# Its VMID is the 8 bits of its IP on our LAN (= ansible_host: 225).
pve_vm:
  cores: 1
  memory: 768  # the agent (role alloy) alone holds about 270 MB
  start_order: 2  # before torrent, whose only way out it is
  untrusted: true
  # The LAN, and the gateway address of torrent's isolated network.
  networks:
    - bridge: vmbr0
    - bridge: vmbr225
      address: 10.250.225.1
      prefix: 24
      forwards: true
  firewall:
    in:
      - iface: net1  # all traffic from torrent, to forward into the VPN tunnel
        from: 10.250.225.0/24
      - proto: tcp
        port: 9101  # torrent's metrics, passed on to it (egress_monitoring_port)
        from: "{{ homelab_monitoring | first }}"

# Role egress.
egress_isolated:
  address: 10.250.225.1
  network: 10.250.225.0/24
  vm: 10.250.225.150
# The tunnel, from its WireGuard config. Empty: torrent has no way out.
# TODO: fill in from the VPN provider's WireGuard config for this device.
egress_vpn_address: ""  # [Interface] Address
egress_vpn_peer_public_key: ""  # [Peer] PublicKey
egress_vpn_endpoint: ""  # [Peer] Endpoint
# [Interface] PrivateKey, when the provider made the key pair. Without one,
# this machine makes its own and the play shows the public key.
# SECRET: in secrets.sops.yaml.
# egress_vpn_private_key: <WireGuard private key>
# The monitoring VM reads torrent's metrics and gets its logs.
egress_monitoring: "{{ homelab_monitoring | first }}"

egress_inbound: []
