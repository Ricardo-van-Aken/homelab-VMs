---
# Facts about this machine. Service settings live in group_vars/<service>.yml.
ansible_host: 10.0.1.110

# The VM as the Proxmox host builds it.
# Its VMID is the 8 bits of its IP on our LAN (= ansible_host: 110). There
# is no hard requirement to do this, it is just personal preference.
pve_vm:
  cores: 2
  memory: 4096
  # Host dataset (pve_storage on srv1) mounted with virtiofs; forgejo_data_dir
  # in group_vars/forgejo.yml points at it.
  shares:
    - dataset: forgejo
      path: /srv/forgejo
