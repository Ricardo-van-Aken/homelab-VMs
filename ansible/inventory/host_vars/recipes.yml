---
# Facts about this machine. Service settings live in group_vars/<service>.yml.
ansible_host: 10.0.1.130

# The VM as the Proxmox host builds it.
# Its VMID is the 8 bits of its IP on our LAN (= ansible_host: 130). There
# is no hard requirement to do this, it is just personal preference.
pve_vm:
  cores: 2
  memory: 2048
  balloon: 1024  # kept at least; Mealie itself may use up to 1000M
  # Host dataset (pve_storage on srv1) mounted with virtiofs; mealie_data_dir
  # in group_vars/mealie.yml points at it.
  shares:
    - dataset: mealie
      path: /srv/mealie
  firewall:
    in:
      - proto: tcp
        port: 80  # HTTP, redirected to HTTPS by Caddy
      - proto: tcp
        port: 443  # Mealie web UI, through Caddy
