---
# Facts about this machine. Service settings live in group_vars/<service>.yml.
# The minecraft-server1 VM's only way in and out.
ansible_host: 10.0.1.226

# The VM as the Proxmox host builds it.
# Its VMID is the 8 bits of its IP on our LAN (= ansible_host: 226).
pve_vm:
  cores: 1
  memory: 512
  untrusted: true
  # The LAN, and the gateway address of minecraft-server1's isolated network.
  networks:
    - bridge: vmbr0
    - bridge: vmbr226
      address: 10.250.226.1
      prefix: 24
      forwards: true
  firewall:
    in:
      - iface: net1  # all traffic from minecraft-server1, to forward into the VPN tunnel
        from: 10.250.226.0/24

# Role egress.
egress_isolated:
  address: 10.250.226.1
  network: 10.250.226.0/24
  vm: 10.250.226.170
# The tunnel to the rented server. Empty: minecraft-server1 has no way out.
# This machine makes its own private key; the play shows the public key.
# TODO: give that public key to the server's operator, and fill these in
# from what they send back.
egress_vpn_address: ""  # the address they give this machine in the tunnel
egress_vpn_peer_public_key: ""  # their server's public key
egress_vpn_endpoint: ""  # their server's public address and port
# Ports passed from the tunnel to minecraft-server1.
egress_inbound:
  - proto: tcp
    port: 25565  # Minecraft Java players
  - proto: udp
    port: 19132  # Minecraft Bedrock players
