---
# Facts about this machine. Service settings live in group_vars/<service>.yml.
# The minecraft-server1 VM's only way in and out.
ansible_host: 10.0.1.226

# The VM as the Proxmox host builds it.
# Its VMID is the 8 bits of its IP on our LAN (= ansible_host: 226).
pve_vm:
  cores: 1
  memory: 512
  untrusted: true
  # The LAN, and the gateway address of minecraft-server1's isolated network.
  networks:
    - bridge: vmbr0
    - bridge: vmbr226
      address: 10.250.226.1
      prefix: 24
  # Traffic from the isolated network arrives on net1 to be forwarded.
  firewall:
    in:
      - iface: net1
        from: 10.250.226.0/24

# Role egress.
egress_isolated:
  address: 10.250.226.1
  network: 10.250.226.0/24
  vm: 10.250.226.170
# TODO: fill in from your VPN provider's WireGuard config for this device,
# the private key as a !vault value: address, private_key, peer_public_key,
# endpoint. Until then minecraft-server1 has no way out.
egress_vpn: {}
egress_inbound: []
