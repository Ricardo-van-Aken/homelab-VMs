---
- name: Proxmox hosts
  hosts: proxmox
  roles:
    - ssh_keys
    - role: pve_passthrough  # only for hosts that pass a GPU to a VM
      when: pve_passthrough_devices | default([]) | length > 0
    - pve_storage
    - pve_template
    - pve_vms

- name: Fixed addresses for the Raspberry Pis
  hosts: pis
  roles:
    - static_address

- name: Base configuration for every VM and Pi
  hosts: vms:pis
  roles:
    - ssh_keys
    - base

- name: Host datasets on the VMs
  hosts: vms
  roles:
    - shares

- name: Jellyfin media servers
  hosts: jellyfin
  roles:
    - jellyfin  # depends on geerlingguy.docker role and gpu

- name: Game streaming hosts
  hosts: gaming
  roles:
    - steam
    - sunshine  # depends on gpu and desktop

- name: Git forges
  hosts: forgejo
  roles:
    - forgejo  # depends on geerlingguy.docker role

- name: File shares
  hosts: samba
  roles:
    - samba

- name: Recipe managers
  hosts: mealie
  roles:
    - mealie  # depends on geerlingguy.docker role

- name: DNS resolvers
  hosts: pihole
  roles:
    - pihole  # depends on geerlingguy.docker role

- name: VPN endpoints
  hosts: wireguard
  roles:
    - wireguard
