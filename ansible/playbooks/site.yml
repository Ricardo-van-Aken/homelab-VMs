---
- name: Proxmox hosts
  hosts: proxmox
  roles:
    - ssh_keys
    - role: pve_passthrough  # only for hosts that pass a GPU to a VM
      when: pve_passthrough_devices | default([]) | length > 0
    - pve_storage
    - pve_network
    - pve_template
    - pve_firewall  # before pve_vms, so a new VM starts with its rules
    - pve_vms

- name: Fixed addresses and firewalls for the Raspberry Pis
  hosts: pis
  roles:
    - static_address
    - host_firewall

# torrent and the Minecraft servers have plays of their own, after their
# gateways.
- name: Base configuration for every VM and Pi
  hosts: vms:pis:!torrent:!minecraft
  roles:
    - ssh_keys
    - base

- name: Host datasets on the VMs
  hosts: vms:!torrent:!minecraft:!monitoring
  roles:
    - shares

# Before the gateways at home, which check that their tunnel answers. No
# ssh_keys: OpenTofu puts the keys on a relay it rents, and a relay run by
# somebody else gets none of ours.
- name: Public ends of the tunnels
  hosts: relay
  roles:
    - base
    - relay

- name: Isolated network gateways
  hosts: egress
  roles:
    - egress

# After the gateways: everything here is downloaded through the tunnel of
# the machine's egress VM (isolated_egress in its host_vars).
- name: Base configuration for torrent
  hosts: torrent
  # Gathered below, once the machine is known to be reachable.
  gather_facts: false
  pre_tasks:
    - name: Leave out a machine whose tunnel is not up
      ansible.builtin.import_tasks: tasks/isolated.yml

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - ssh_keys
    - base

- name: Minecraft servers
  hosts: minecraft
  # Gathered below, once the machine is known to be reachable.
  gather_facts: false
  pre_tasks:
    - name: Leave out a machine whose tunnel is not up
      ansible.builtin.import_tasks: tasks/isolated.yml

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - ssh_keys
    - base
    - minecraft  # depends on geerlingguy.docker role

- name: Jellyfin media servers
  hosts: jellyfin
  roles:
    - jellyfin  # depends on geerlingguy.docker role and gpu

- name: Game streaming hosts
  hosts: gaming
  roles:
    - sunshine  # depends on gpu and desktop, which makes the user steam needs
    - steam

- name: Git forges
  hosts: forgejo
  roles:
    - forgejo  # depends on geerlingguy.docker role

- name: File shares
  hosts: samba
  roles:
    - samba

- name: Recipe managers
  hosts: mealie
  roles:
    - mealie  # depends on geerlingguy.docker role

- name: DNS resolvers
  hosts: pihole
  roles:
    - pihole  # depends on geerlingguy.docker role

- name: VPN endpoints
  hosts: wireguard
  roles:
    - wireguard

# After the DNS resolvers, which the host needs to reach Let's Encrypt.
- name: Name and certificate for the Proxmox web UI
  hosts: proxmox
  roles:
    - role: pve_webui
      when: caddy_https | bool

- name: Metrics and logs
  hosts: grafana
  roles:
    - grafana  # depends on geerlingguy.docker role

# Last, so the agent finds Docker where a service installed it.
- name: Agents for metrics and logs
  hosts: vms:proxmox:pis
  # Gathered below, once the machine is known to be reachable.
  gather_facts: false
  pre_tasks:
    - name: Leave out a machine whose tunnel is not up
      ansible.builtin.import_tasks: tasks/isolated.yml

    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - alloy
