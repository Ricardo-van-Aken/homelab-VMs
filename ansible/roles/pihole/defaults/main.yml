---
# pihole/pihole:2026.10.0 -- digest pushed 2026-10-17 11:55 UTC
pihole_image: pihole/pihole@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
pihole_dir: /opt/stacks/pihole
# Configuration, gravity database and query log.
pihole_data_dir: "{{ pihole_dir }}/data"

# Where the LAN reaches the resolver and the admin UI (http://<vm>/admin).
pihole_dns_port: 53
pihole_web_port: 80

# Resolvers for everything that is not a local record.
pihole_upstreams:
  - 1.1.1.1
  - 1.0.0.1

# Local records in hosts-file form, "<address> <name> [<name> ...]". The
# inventory builds them in group_vars/pihole.yml.
pihole_records: []

# Password for the admin UI and API. Required: without one Pi-hole picks a
# random password at every start.
pihole_web_password: ""  # put a !vault value in group_vars
