---
# Release tag on https://github.com/LizardByte/Sunshine/releases. Assets are
# built per Ubuntu series and architecture; every asset used must have its
# sha256 listed in sunshine_deb_checksums or the download is refused.
sunshine_version: v2026.906.222525
sunshine_ubuntu_release: "{{ ansible_facts.distribution_version }}"
sunshine_deb_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
sunshine_deb_name: >-
  sunshine_{{ sunshine_version | regex_replace('^v', '') }}-1+ubuntu{{ sunshine_ubuntu_release
  }}_{{ sunshine_deb_arch }}.deb
sunshine_deb_url: >-
  https://github.com/LizardByte/Sunshine/releases/download/{{ sunshine_version }}/{{ sunshine_deb_name }}
sunshine_deb_checksums:
  "26.04/amd64": sha256:454fde456eb8f429f94e5a1297cb6f2f55a46bbab4832f71752ec5bc9b0fa453
sunshine_deb_checksum: "{{ sunshine_deb_checksums[sunshine_ubuntu_release ~ '/' ~ sunshine_deb_arch] }}"

sunshine_user: "{{ desktop_user }}"
sunshine_config_dir: "/home/{{ sunshine_user }}/.config/sunshine"
# Name of the user unit shipped in the .deb (sunshine.service is only an alias
# that exists after enabling).
sunshine_unit: app-dev.lizardbyte.app.Sunshine.service

# Web UI and stream ports are only reachable from the LAN.
sunshine_origin_web_ui_allowed: lan
# GPU used for capture and encoding; empty lets Sunshine pick. With several
# GPUs, set a stable path such as /dev/dri/by-path/pci-0000:01:00.0-render.
sunshine_adapter: ""
sunshine_apps:
  - name: Desktop
    image-path: desktop.png
  - name: Steam Big Picture
    image-path: steam.png
    detached:
      - setsid steam steam://open/bigpicture
    prep-cmd:
      - do: ""
        undo: setsid steam steam://close/bigpicture
