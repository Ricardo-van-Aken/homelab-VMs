---
# WireGuard through wg-easy, whose web UI manages the clients.
wireguard_image: >-
  ghcr.io/wg-easy/wg-easy:15@sha256:071f79a639e9361123a5e57733107320207b844ddbbd92dfa6962f541fe8aac8
wireguard_dir: /opt/stacks/wg-easy
# Clients, server key and the UI's settings.
wireguard_data_dir: "{{ wireguard_dir }}/data"

# The tunnel, published on the machine.
wireguard_port: 51820

# The web UI, through Caddy (role caddy); wg-easy listens on 127.0.0.1 only.
wireguard_domain: "{{ inventory_hostname }}"
wireguard_web_port: 51821
# wg-easy refuses plain HTTP unless told so.
wireguard_insecure: "{{ not (caddy_https | bool) }}"

# Resolvers written into every new client's config. wg-easy reads this on
# its first start only; afterwards the web UI owns the setting.
wireguard_client_dns: []

# Admin account and the address clients connect to (with wireguard_port),
# also read on the first start only; with them wg-easy skips its setup
# screen. Empty password: the setup screen asks instead.
wireguard_admin_user: admin
wireguard_admin_password: ""  # put a !vault value in group_vars
wireguard_public_host: ""  # your public IP address, or a DNS name for it

# Docker network, as wg-easy's own compose file defines it. Caddy's requests
# arrive from its gateway.
wireguard_docker_subnet: 10.42.42.0/24
wireguard_docker_address: 10.42.42.42
wireguard_docker_subnet6: fdcc:ad94:bacf:61a3::/64
wireguard_docker_address6: fdcc:ad94:bacf:61a3::2a
wireguard_trusted_proxies: 10.42.42.1,fdcc:ad94:bacf:61a3::1
