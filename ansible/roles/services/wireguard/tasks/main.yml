---
- name: Create stacks directory
  ansible.builtin.file:
    path: "{{ wireguard_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create wg-easy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ wireguard_dir }}"
    - "{{ wireguard_data_dir }}"

- name: Render compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ wireguard_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Render the Caddy site
  ansible.builtin.template:
    src: caddy.j2
    dest: "{{ caddy_sites_dir }}/wireguard.caddy"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Caddy

- name: Deploy wg-easy stack
  community.docker.docker_compose_v2:
    project_src: "{{ wireguard_dir }}"
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 120
