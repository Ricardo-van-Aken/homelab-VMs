---
- name: Check the first-start settings
  ansible.builtin.assert:
    that: wireguard_public_host | length > 0
    fail_msg: wireguard_admin_password needs wireguard_public_host in group_vars
  when: wireguard_admin_password | length > 0

- name: Create stacks directory
  ansible.builtin.file:
    path: "{{ wireguard_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create wg-easy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ wireguard_dir }}"
    - "{{ wireguard_data_dir }}"

# Kept out of compose.yml so that file stays readable.
- name: Write the first-start settings
  ansible.builtin.copy:
    content: |
      INIT_USERNAME={{ wireguard_admin_user }}
      INIT_PASSWORD={{ wireguard_admin_password }}
      INIT_HOST={{ wireguard_public_host }}
      INIT_PORT={{ wireguard_port }}
    dest: "{{ wireguard_dir }}/init.env"
    owner: root
    group: root
    mode: "0600"
  when: wireguard_admin_password | length > 0
  no_log: true

- name: Render compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ wireguard_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Render the Caddy site
  ansible.builtin.template:
    src: caddy.j2
    dest: "{{ caddy_sites_dir }}/wireguard.caddy"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Caddy

# Compose only says "unhealthy"; the reason is in wg-easy's own log.
- name: Deploy wg-easy stack
  block:
    - name: Start wg-easy
      community.docker.docker_compose_v2:
        project_src: "{{ wireguard_dir }}"
        state: present
        remove_orphans: true
        wait: true
        wait_timeout: 120
  rescue:
    - name: Read wg-easy's log
      ansible.builtin.command: docker logs --tail 40 wg-easy
      register: wireguard_log
      changed_when: false
      failed_when: false

    - name: Fail with wg-easy's log
      ansible.builtin.fail:
        msg: >-
          {{ ['wg-easy did not become healthy; its last log lines:']
             + wireguard_log.stdout_lines + wireguard_log.stderr_lines }}
