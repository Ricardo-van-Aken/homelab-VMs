---
# A Fabric server for Java players, with Geyser and Floodgate letting Bedrock
# players in. Ansible sets what is below and installs the mods; the
# whitelist, operators and the mods' own settings are changed on the running
# server and kept.
minecraft_image: >-
  itzg/minecraft-server:2026.11.0-java25@sha256:8d5080d8dcd0a2629c2e4f248678373a337a40537ad6ef2857c7dbcda6e3eadd
minecraft_dir: /opt/stacks/minecraft
# Worlds, settings and the mods; put it on a disk of its own.
minecraft_data_dir: /srv/minecraft
# The disk mounted there, formatted when it is still empty. Empty: the
# directory stays on the root disk.
minecraft_data_device: ""  # e.g. /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1

# Service account owning the data; the container runs as the same ids.
minecraft_user: minecraft
minecraft_uid: 2004

# Running a server means agreeing to Mojang's End User License Agreement
# (https://aka.ms/MinecraftEULA). Set to true to agree.
minecraft_eula: false

# The image downloads these exact versions on its first start.
minecraft_version: "26.3"
minecraft_fabric_loader_version: 0.20.1
minecraft_fabric_launcher_version: 1.1.2

# Java heap, and the limit for the whole container, which needs room on top.
minecraft_memory: 4G
minecraft_memory_limit: 5g

minecraft_java_port: 25565  # TCP
minecraft_bedrock_port: 19132  # UDP, Geyser

# The world's directory name. A new name starts a new world.
minecraft_world: world
# Only read when a world is created; empty picks a random one. The role
# refuses a different seed for a world that exists.
minecraft_seed: ""
# How far a new world reaches from 0,0 in every direction, in blocks, in
# every dimension; 0 leaves it unlimited. Set once: afterwards the border
# is changed on the running server (`worldborder set`).
minecraft_world_radius: 0
minecraft_motd: A Minecraft Server
minecraft_difficulty: easy
minecraft_max_players: 20

# Java player names added to the whitelist and the operators at every start.
# Names added on the running server stay; one removed there comes back if it
# is listed here.
minecraft_whitelist: []
minecraft_ops: []

# Settings files for mods, copied into the server's config directory when
# they are not there yet, so changes made on the server are kept.
#   - src: "{{ inventory_dir }}/files/minecraft/structurify.json"
#     dest: structurify.json
minecraft_config_files: []

# Backups of everything the server writes, encrypted and stored in an S3
# bucket with restic; only what changed is uploaded. Off while the
# repository is empty. `minecraft-restore` on the machine puts one back.
minecraft_backup_image: >-
  itzg/mc-backup:2026.11.0@sha256:a68dee00b2b56bd443bee7d310e5fc49e66682c0d1f4040cda6efa52d8c51df8
minecraft_backup_repository: ""  # s3:https://<endpoint>/<bucket>
minecraft_backup_region: auto  # the bucket's region; auto on Cloudflare R2
# The bucket's key pair, as !vault values.
minecraft_backup_access_key_id: ""
minecraft_backup_secret_access_key: ""
# Encrypts the backups, as a !vault value. Keep a copy elsewhere: without
# it no backup can be read.
minecraft_backup_password: ""
minecraft_backup_interval: 1h
# No backups while nobody is playing: nothing changes then.
minecraft_backup_only_with_players: true
# A server that has no world yet loads the newest backup of
# minecraft_world, with its whitelist and settings, when there is one. It
# makes a new world otherwise.
minecraft_backup_load_new_server: true
# The settings that are loaded along with a world, in the server's directory.
minecraft_backup_settings:
  - config
  - whitelist.json
  - ops.json
  - banned-players.json
  - banned-ips.json
# Which backups are kept (restic's `forget` options).
minecraft_backup_retention: --keep-hourly 48 --keep-daily 14 --keep-weekly 8

# Extra settings of the image (https://docker-minecraft-server.readthedocs.io),
# merged into the container environment: VIEW_DISTANCE, PVP, ...
minecraft_extra_env: {}

# Mods, each a jar file with its checksum. One that is no longer listed is
# removed. Client-only mods (Sodium, Mod Menu, ...) do not belong here.
