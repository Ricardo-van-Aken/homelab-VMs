---
- name: Check the license is agreed to
  ansible.builtin.assert:
    that: minecraft_eula | bool
    fail_msg: >-
      minecraft_eula is false. Read https://aka.ms/MinecraftEULA and set it
      to true to agree; the server does not start without it.

- name: Check the settings
  ansible.builtin.assert:
    that:
      - minecraft_world_radius | int >= 0
      - minecraft_world is match('^[A-Za-z0-9_-]+$')
      - minecraft_mods | rejectattr('checksum', 'match', '^sha256:[0-9a-f]{64}$') | list | length == 0
      - minecraft_mods | map(attribute='url') | map('basename') | unique | length == minecraft_mods | length
    fail_msg: >-
      minecraft_world_radius must be 0 or more, minecraft_world a plain
      directory name, and every mod needs its own file name and a
      sha256:<64 hex digits> checksum.

- name: Put the data on its own disk
  when: minecraft_data_device | length > 0
  block:
    - name: Look for the data disk
      ansible.builtin.stat:
        path: "{{ minecraft_data_device }}"
      register: minecraft_data_disk

    - name: Check the data disk is there
      ansible.builtin.assert:
        that: minecraft_data_disk.stat.exists
        fail_msg: >-
          {{ minecraft_data_device }} does not exist; does the VM have the
          disk (pve_vm.disks), and has it been restarted since it got it?

    # Only an empty disk is formatted; one with a filesystem is left as it is.
    - name: Format the data disk
      community.general.filesystem:
        dev: "{{ minecraft_data_device }}"
        fstype: ext4

    - name: Mount the data disk
      ansible.posix.mount:
        path: "{{ minecraft_data_dir }}"
        src: "{{ minecraft_data_device }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted

- name: Create Minecraft service group
  ansible.builtin.group:
    name: "{{ minecraft_user }}"
    gid: "{{ minecraft_uid }}"
    system: true

- name: Create Minecraft service account
  ansible.builtin.user:
    name: "{{ minecraft_user }}"
    uid: "{{ minecraft_uid }}"
    group: "{{ minecraft_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create stacks directory
  ansible.builtin.file:
    path: "{{ minecraft_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The mods are root's and mounted read-only: the server cannot change the
# code it runs.
- name: Create Minecraft directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ minecraft_dir }}", owner: root, mode: "0755"}
    - {path: "{{ minecraft_data_dir }}", owner: root, mode: "0755"}
    - {path: "{{ minecraft_data_dir }}/mods", owner: root, mode: "0755"}
    - {path: "{{ minecraft_data_dir }}/data", owner: "{{ minecraft_user }}", mode: "0750"}
    - {path: "{{ minecraft_data_dir }}/data/config", owner: "{{ minecraft_user }}", mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

- name: Download the mods
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ minecraft_data_dir }}/mods/{{ item.url | basename | urldecode }}"
    checksum: "{{ item.checksum }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ minecraft_mods }}"
  loop_control:
    label: "{{ item.name }}"
  register: minecraft_mods_downloaded

- name: List the mods on disk
  ansible.builtin.find:
    paths: "{{ minecraft_data_dir }}/mods"
  register: minecraft_mods_found

- name: Remove mods that are no longer listed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ minecraft_mods_found.files | map(attribute='path') | map('basename')
       | difference(minecraft_mods | map(attribute='url') | map('basename') | map('urldecode'))
       | map('regex_replace', '^', minecraft_data_dir ~ '/mods/') | list }}
  register: minecraft_mods_removed

- name: Create directories for the mods' settings files
  ansible.builtin.file:
    path: "{{ minecraft_data_dir }}/data/config/{{ item.dest | dirname }}"
    state: directory
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0755"
  loop: "{{ minecraft_config_files }}"
  loop_control:
    label: "{{ item.dest }}"
  when: item.dest | dirname | length > 0

# force: false, so a file changed on the server is never overwritten.
- name: Copy the mods' settings files that are not there yet
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ minecraft_data_dir }}/data/config/{{ item.dest }}"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0644"
    force: false
  loop: "{{ minecraft_config_files }}"
  loop_control:
    label: "{{ item.dest }}"

# The server only reads the seed when it creates a world. Remember the one
# each world was made with, and refuse a different one.
- name: Look for the world
  ansible.builtin.stat:
    path: "{{ minecraft_data_dir }}/data/{{ minecraft_world }}/level.dat"
  register: minecraft_world_file

- name: Read the seed the world was made with
  ansible.builtin.slurp:
    src: "{{ minecraft_dir }}/{{ minecraft_world }}.seed"
  register: minecraft_seed_file
  failed_when: false

- name: Check the seed is still the world's
  ansible.builtin.assert:
    that: (minecraft_seed_file.content | b64decode | trim) == (minecraft_seed | string)
    fail_msg: >-
      The world "{{ minecraft_world }}" was made with seed
      "{{ minecraft_seed_file.content | b64decode | trim }}", and a seed
      cannot be changed afterwards. Set minecraft_seed back, or set
      minecraft_world to a new name to start a new world with this seed.
  when:
    - minecraft_world_file.stat.exists
    - minecraft_seed_file.content is defined

- name: Remember the world's seed
  ansible.builtin.copy:
    content: "{{ minecraft_seed }}\n"
    dest: "{{ minecraft_dir }}/{{ minecraft_world }}.seed"
    owner: root
    group: root
    mode: "0644"

# Made here and never in the repository; the server and its backups share it.
- name: Make the console password
  ansible.builtin.shell: >-
    umask 077 && openssl rand -hex 24 > {{ minecraft_dir }}/rcon-password
    || { rm -f {{ minecraft_dir }}/rcon-password; exit 1; }
  args:
    creates: "{{ minecraft_dir }}/rcon-password"

- name: Let the containers read the console password
  ansible.builtin.file:
    path: "{{ minecraft_dir }}/rcon-password"
    owner: root
    group: "{{ minecraft_user }}"
    mode: "0640"

- name: Set up backups
  when: minecraft_backup_repository | length > 0
  block:
    # The values go into a file between single quotes, taken as they are.
    - name: Check the backup settings
      ansible.builtin.assert:
        that:
          - item | length > 0
          - item is not search("['\n]")
        fail_msg: >-
          minecraft_backup_repository is set, so minecraft_backup_region,
          _access_key_id, _secret_access_key and _password must be set too,
          without single quotes or line breaks.
      loop:
        - "{{ minecraft_backup_repository }}"
        - "{{ minecraft_backup_region }}"
        - "{{ minecraft_backup_access_key_id }}"
        - "{{ minecraft_backup_secret_access_key }}"
        - "{{ minecraft_backup_password }}"
      no_log: true

    - name: Write the backup secrets
      ansible.builtin.template:
        src: backup.env.j2
        dest: "{{ minecraft_dir }}/backup.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Install the restore command
      ansible.builtin.template:
        src: minecraft-restore.j2
        dest: /usr/local/bin/minecraft-restore
        owner: root
        group: root
        mode: "0755"

- name: Remove what backups leave behind when they are off
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ minecraft_dir }}/backup.env"
    - /usr/local/bin/minecraft-restore
  when: minecraft_backup_repository | length == 0

- name: Render compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ minecraft_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

# Before the first start, which would make a new world otherwise.
- name: Load the world from the newest backup on a server without one
  when:
    - minecraft_backup_repository | length > 0
    - minecraft_backup_load_new_server | bool
    - not minecraft_world_file.stat.exists
  block:
    # A bucket nothing was backed up to yet is not an error.
    - name: Look for backups of the world
      ansible.builtin.command: >-
        docker compose --project-directory {{ minecraft_dir }}
        run --rm --no-deps restore
        snapshots --tag {{ minecraft_world }} --json
      register: minecraft_backups
      changed_when: false
      failed_when:
        - minecraft_backups.rc != 0
        - minecraft_backups.stderr is not search('Is there a repository at the following location')

    - name: Load the newest backup
      ansible.builtin.command: >-
        docker compose --project-directory {{ minecraft_dir }}
        run --rm --no-deps restore
        restore latest --tag {{ minecraft_world }} --target /
        --include /data/{{ minecraft_world }}
        {% for path in minecraft_backup_settings %}
        --include /data/{{ path }}
        {% endfor %}
      register: minecraft_backup_loaded
      changed_when: true
      when:
        - minecraft_backups.rc == 0
        - minecraft_backups.stdout_lines | last | default('[]') | from_json | length > 0

# The image's health check pings the server. A first start downloads the
# server and creates the world, which takes minutes.
- name: Deploy Minecraft stack
  community.docker.docker_compose_v2:
    project_src: "{{ minecraft_dir }}"
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 900
  register: minecraft_deploy

# Once per world: after that the border belongs to the running server, and
# a change made there is kept. Each dimension has a border of its own.
- name: Look whether the world was given its border
  ansible.builtin.stat:
    path: "{{ minecraft_dir }}/{{ minecraft_world }}.border"
  register: minecraft_border_file

- name: Give a new world its border
  ansible.builtin.command: >-
    docker exec minecraft rcon-cli execute in {{ item }} run
    worldborder set {{ minecraft_world_radius | int * 2 }}
  loop:
    - minecraft:overworld
    - minecraft:the_nether
    - minecraft:the_end
  register: minecraft_border
  changed_when: true
  failed_when: minecraft_border.rc != 0 or minecraft_border.stdout is not search('world border')
  when:
    - minecraft_world_radius | int > 0
    - not minecraft_border_file.stat.exists
    # A loaded world brings the border it had.
    - minecraft_backup_loaded is not defined or minecraft_backup_loaded is skipped

- name: Remember the world was given its border
  ansible.builtin.copy:
    content: "{{ minecraft_world_radius }}\n"
    dest: "{{ minecraft_dir }}/{{ minecraft_world }}.border"
    owner: root
    group: root
    mode: "0644"
    force: false
  when: minecraft_world_radius | int > 0

# Geyser writes its settings on the first start. Its default makes Bedrock
# players log in with a Java account; Floodgate lets in their Xbox account.
- name: Let Bedrock players in with their Xbox account
  ansible.builtin.lineinfile:
    path: "{{ minecraft_data_dir }}/data/config/Geyser-Fabric/config.yml"
    regexp: '^(\s*)auth-type:'
    line: '\1auth-type: floodgate'
    backrefs: true
  register: minecraft_geyser_auth

# A running server only loads its mods and their settings when it starts.
- name: Restart Minecraft to load the changed mods
  community.docker.docker_compose_v2:
    project_src: "{{ minecraft_dir }}"
    state: restarted
    wait: true
    wait_timeout: 900
  when: >-
    minecraft_geyser_auth.changed
    or (not minecraft_deploy.changed
        and (minecraft_mods_downloaded.changed or minecraft_mods_removed.changed))
