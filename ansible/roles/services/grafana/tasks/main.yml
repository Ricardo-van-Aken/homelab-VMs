---
- name: Check the admin password is set
  ansible.builtin.assert:
    that: grafana_admin_password | length >= 8
    fail_msg: grafana_admin_password is empty or shorter than 8 characters; put it in the group's secrets.sops.yaml.

- name: Put the data on its own disk
  when: grafana_data_device | length > 0
  block:
    - name: Look for the data disk
      ansible.builtin.stat:
        path: "{{ grafana_data_device }}"
      register: grafana_data_disk

    - name: Check the data disk is there
      ansible.builtin.assert:
        that: grafana_data_disk.stat.exists
        fail_msg: >-
          {{ grafana_data_device }} does not exist; does the VM have the
          disk (pve_vm.disks), and has it been restarted since it got it?

    # Only an empty disk is formatted; one with a filesystem is left as it is.
    - name: Format the data disk
      community.general.filesystem:
        dev: "{{ grafana_data_device }}"
        fstype: ext4

    - name: Mount the data disk
      ansible.posix.mount:
        path: "{{ grafana_data_dir }}"
        src: "{{ grafana_data_device }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted

- name: Create Grafana service group
  ansible.builtin.group:
    name: "{{ grafana_user }}"
    gid: "{{ grafana_uid }}"
    system: true

- name: Create Grafana service account
  ansible.builtin.user:
    name: "{{ grafana_user }}"
    uid: "{{ grafana_uid }}"
    group: "{{ grafana_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create stacks directory
  ansible.builtin.file:
    path: "{{ grafana_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Grafana directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ grafana_user }}"
    group: "{{ grafana_user }}"
    mode: "0750"
  loop:
    - "{{ grafana_dir }}"
    - "{{ grafana_data_dir }}"
    - "{{ grafana_data_dir }}/prometheus"
    - "{{ grafana_data_dir }}/loki"
    - "{{ grafana_data_dir }}/grafana"
    - "{{ grafana_dir }}/provisioning"
    - "{{ grafana_dir }}/provisioning/datasources"
    - "{{ grafana_dir }}/provisioning/dashboards"
    - "{{ grafana_dir }}/dashboards"
    - "{{ grafana_dir }}/rules"

- name: Check the machines that are watched
  vars:
    jobs: "{{ item.also | default([]) | map(attribute='job', default='') | list }}"
    ports: "{{ item.also | default([]) | map(attribute='port', default=0) | map('int') | list }}"
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9-]+$')
      - item.address | default('') | length > 0
      - item.port | default(0) | int > 0
      - jobs | reject('match', '^[a-z0-9_]+$') | list | length == 0
      - jobs | intersect(['node', 'processes', 'applications']) | length == 0
      - ports | select('<', 1) | list | length == 0
    fail_msg: >-
      every machine in grafana_machines needs a name of letters, digits and
      hyphens, an address and a port; every entry under also needs a port
      and a job of lower-case letters, digits and underscores, other than
      node, processes and applications.
    quiet: true
  loop: "{{ grafana_machines }}"
  loop_control:
    label: "{{ item.name | default(item) }}"

# Two machines with the same token could not be told apart.
- name: Check every machine has a token of its own
  vars:
    names: "{{ grafana_machines | map(attribute='name') | list }}"
    tokens: "{{ grafana_tokens | dict2items | selectattr('key', 'in', names) | map(attribute='value') | list }}"
  ansible.builtin.assert:
    that:
      - names | difference(grafana_tokens.keys()) | length == 0
      - tokens | unique | length == tokens | length
      - tokens | reject('match', '^[A-Za-z0-9._~+/=-]{32,}$') | list | length == 0
    fail_msg: >-
      grafana_tokens needs a token for each of these machines, no two the
      same, each 32 characters or more of letters, digits and . _ ~ + / = -
      Without a token: {{ names | difference(grafana_tokens.keys()) | join(', ') | default('none', true) }}.
    quiet: true

- name: Render the stores' configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ grafana_dir }}/{{ item }}"
    owner: root
    group: "{{ grafana_user }}"
    mode: "0640"
  loop:
    - prometheus.yml
    - loki.yml
    - provisioning/datasources/stores.yml
    - provisioning/dashboards/files.yml
  notify: Restart the Grafana stack

- name: Copy the dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ grafana_dir }}/dashboards/"
    owner: root
    group: "{{ grafana_user }}"
    mode: "0640"

# Series Prometheus works out itself from the ones it reads.
- name: Copy Prometheus's rules
  ansible.builtin.copy:
    src: rules/
    dest: "{{ grafana_dir }}/rules/"
    owner: root
    group: "{{ grafana_user }}"
    mode: "0640"
  notify: Restart the Grafana stack

# Kept out of compose.yml so that file stays readable.
- name: Write the admin password
  ansible.builtin.copy:
    content: "GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}\n"
    dest: "{{ grafana_dir }}/grafana.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ grafana_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

# The site carries the tokens; root-only, and Caddy runs as root.
- name: Render the Caddy site
  ansible.builtin.template:
    src: caddy.j2
    dest: "{{ caddy_sites_dir }}/grafana.caddy"
    owner: root
    group: root
    mode: "0600"
  notify: Restart Caddy
  no_log: true

- name: Deploy Grafana stack
  community.docker.docker_compose_v2:
    project_src: "{{ grafana_dir }}"
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 180
