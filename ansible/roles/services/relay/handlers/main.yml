---
- name: Reload relay firewall
  ansible.builtin.systemd_service:
    name: relay
    state: reloaded

- name: Restart relay tunnel
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ relay_interface }}"
    state: restarted

# Without its admin API, Caddy reads its configuration only at start.
- name: Restart relay Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: restarted
