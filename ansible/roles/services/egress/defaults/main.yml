---
# The only way in and out of one isolated network, which holds one VM:
# traffic from it is forwarded into a WireGuard tunnel to a VPN provider and
# nowhere else. Without a tunnel configured, nothing is forwarded. The
# isolated network cannot reach this machine, except for replies to
# connections it starts (SSH to the VM there).

# This machine's address on the isolated network, the network, and the VM
# on it.
#   address: 10.250.225.1
#   network: 10.250.225.0/24
#   vm: 10.250.225.150
egress_isolated: {}

# Switches the tunnel below off without removing its settings.
egress_vpn: true
# The tunnel, from the other side's WireGuard config. All empty: no tunnel,
# and no way out for the isolated network.
egress_vpn_address: ""  # [Interface] Address, e.g. 10.64.12.34/32
egress_vpn_peer_public_key: ""  # [Peer] PublicKey
egress_vpn_endpoint: ""  # [Peer] Endpoint, e.g. 198.51.100.7:51820
# When the other side is one of our own machines (role relay): its inventory
# name. Its public key is then read from it, and it reads this machine's.
egress_relay: ""
# [Interface] PrivateKey, in the host's secrets.sops.yaml, when the other
# side made the key pair (a VPN provider). Empty: this machine makes its
# own, and every run shows the public key the other side needs.
egress_vpn_private_key: ""
# Where the private key is kept on this machine, given or made here.
egress_vpn_key_file: "/etc/wireguard/{{ egress_vpn_interface }}.key"
egress_vpn_interface: vpn
# Routing table for the isolated network's traffic: only a route into the
# tunnel lives there.
egress_vpn_table: 51820

# Ports opened to the VM from the tunnel's side: the provider's port
# forwarding, or a rented server that tunnels in. Never from the LAN.
#   - proto: tcp
#     port: 25565      # say why it is open, e.g. Minecraft players
egress_inbound: []

# With the tunnel off, or silent for three minutes, the isolated network
# leaves through this machine's own connection: the sites it contacts see
# that address. It never reaches a private network that way.
egress_outbound_lan: false

# A second way in: a NetBird network somebody else runs, in which a public
# server passes ports to this machine. That server must masquerade, so
# replies return to it. NetBird sets up no firewall, routes or DNS here.
egress_netbird: false
# The network's management server and a setup key from its operator, in the
# host's secrets.sops.yaml.
egress_netbird_management_url: ""  # https://netbird.example.org
egress_netbird_setup_key: ""
# The addresses of that network; NetBird's own default.
egress_netbird_network: 100.64.0.0/10
egress_netbird_interface: wt0
# Ports passed from NetBird to the VM.
#   - proto: tcp
#     port: 25565      # say why it is open, e.g. Minecraft players
egress_netbird_inbound: []
# https://github.com/netbirdio/netbird/releases
egress_netbird_version: 0.83.1
egress_netbird_checksum: sha256:742d6572939f21b36379e8def58c3508de72b44200af2d12e245576aefa3b5a9
