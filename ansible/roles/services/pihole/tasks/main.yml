---
- name: Check the admin password is set
  ansible.builtin.assert:
    that: pihole_web_password | length > 0
    fail_msg: pihole_web_password is empty; put a !vault value in group_vars.

# Ubuntu's systemd-resolved holds port 53 on 127.0.0.53, which Docker's port
# publishing cannot share. Turn the stub listener off and let the VM read
# the upstream resolvers it got from cloud-init directly.
- name: Read the service list
  ansible.builtin.service_facts:

- name: Configure systemd-resolved
  when: "'systemd-resolved.service' in ansible_facts.services"
  block:
    - name: Create the resolved drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Disable the stub listener
      ansible.builtin.copy:
        content: |
          [Resolve]
          DNSStubListener=no
        dest: /etc/systemd/resolved.conf.d/pihole.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-resolved

    - name: Point resolv.conf at the upstream resolvers
      ansible.builtin.file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true
      notify: Restart systemd-resolved

    - name: Apply the resolver change before the port is needed
      ansible.builtin.meta: flush_handlers

- name: Create stacks directory
  ansible.builtin.file:
    path: "{{ pihole_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Pi-hole directory
  ansible.builtin.file:
    path: "{{ pihole_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# The container takes ownership of its data directory at start, so no owner
# or mode is enforced here.
- name: Create Pi-hole data directory  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ pihole_data_dir }}"
    state: directory

- name: Render compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ pihole_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Render the Caddy site
  ansible.builtin.template:
    src: caddy.j2
    dest: "{{ caddy_sites_dir }}/pihole.caddy"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Caddy

# Kept out of compose.yml so that file stays readable.
- name: Write the admin password
  ansible.builtin.copy:
    content: "FTLCONF_webserver_api_password={{ pihole_web_password }}\n"
    dest: "{{ pihole_dir }}/pihole.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# The image's health check resolves pi.hole through its own resolver.
- name: Deploy Pi-hole stack
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_dir }}"
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 120
