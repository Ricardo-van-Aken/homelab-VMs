---
pihole_image: >-
  pihole/pihole:2026.10.0@sha256:d34134716fc32038b052a8674c7c6879e0ff21f0e6d8af345166fffa2c27c113
pihole_dir: /opt/stacks/pihole
# Configuration, gravity database and query log.
pihole_data_dir: "{{ pihole_dir }}/data"

# Where the LAN reaches the resolver.
pihole_dns_port: 53
# The admin UI (/admin) goes through Caddy (role caddy) under this name;
# Pi-hole itself listens on 127.0.0.1 only.
pihole_domain: "{{ inventory_hostname }}"
pihole_web_port: 8080

# Resolvers for everything that is not a local record.
pihole_upstreams:
  - 1.1.1.1
  - 1.0.0.1

# Local records in hosts-file form, "<address> <name> [<name> ...]". The
# inventory builds them in group_vars/pihole.yml.
pihole_records: []

# DHCP, for a router that cannot hand out the Pi-hole as DNS server. Off
# while the range is empty. On, the container joins the host's network
# (DHCP is broadcast traffic), so the host's firewall must let in 53 and
# 67/udp; the latter from any source, as clients have no address yet.
pihole_dhcp_start: ""  # e.g. 10.0.1.10
pihole_dhcp_end: ""  # e.g. 10.0.1.59
pihole_dhcp_router: ""  # the gateway handed to clients
pihole_dhcp_dns: []  # the DNS servers handed to clients
pihole_dhcp_lease_time: 24h
# Seconds to wait before answering. Above 0 on a backup, so it only wins
# when the main instance is down.
pihole_dhcp_reply_delay: 0

# Password for the admin UI and API. Required: without one Pi-hole picks a
# random password at every start.
pihole_web_password: ""  # put a !vault value in group_vars
