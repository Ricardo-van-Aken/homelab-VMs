---
# Creates and reconciles the VMs defined in the inventory. A VM is cloned
# once; afterwards only the settings in its pve_vm dict are kept in line.
# VMs are never deleted.
- name: Require a gateway for the static addresses
  ansible.builtin.assert:
    that: pve_vms_gateway | length > 0
    fail_msg: set pve_vms_gateway in group_vars/proxmox.yml

- name: Require an address and a definition for every VM
  ansible.builtin.assert:
    that:
      - hostvars[item].ansible_host is defined
      - hostvars[item].pve_vm is defined
    fail_msg: "{{ item }} needs ansible_host and a pve_vm dict in its host_vars"
  loop: "{{ groups['vms'] }}"

# Host datasets and passed-through devices are paths from the VM into the
# host; an untrusted VM gets neither.
- name: Refuse host access for untrusted VMs
  ansible.builtin.assert:
    that:
      - hostvars[item].pve_vm.shares | default([]) | length == 0
      - hostvars[item].pve_vm.hostpci | default([]) | length == 0
      - hostvars[item].pve_vm.balloon is not defined
    fail_msg: "{{ item }} is untrusted: remove its shares, hostpci and balloon"
  loop: "{{ groups['vms'] }}"
  when: hostvars[item].pve_vm.untrusted | default(false) | bool

# A passed-through device pins all of the VM's memory, so a balloon frees
# nothing.
- name: Refuse ballooning with passed-through devices
  ansible.builtin.assert:
    that: hostvars[item].pve_vm.balloon is not defined
    fail_msg: "{{ item }} has hostpci devices: remove its balloon"
  loop: "{{ groups['vms'] }}"
  when: hostvars[item].pve_vm.hostpci | default([]) | length > 0

# The inventory name becomes the VM name, which Proxmox validates as a DNS
# label: letters, digits and hyphens only.
- name: Require DNS-safe VM names
  ansible.builtin.assert:
    that: item is match('^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?$')
    fail_msg: "{{ item }} is not a valid VM name; use letters, digits and hyphens"
  loop: "{{ groups['vms'] }}"

# On a CPU with performance and efficiency cores the kernel lists each kind
# here; on any other CPU these files do not exist.
- name: Read the performance cores
  ansible.builtin.command: cat /sys/devices/cpu_core/cpus
  register: pve_vms_performance_cores
  failed_when: false
  changed_when: false

- name: Read the efficiency cores
  ansible.builtin.command: cat /sys/devices/cpu_atom/cpus
  register: pve_vms_efficiency_cores
  failed_when: false
  changed_when: false

- name: Remember the kinds of cores
  ansible.builtin.set_fact:
    pve_vms_core_sets:
      performance: "{{ pve_vms_performance_cores.stdout | default('') | trim }}"
      efficiency: "{{ pve_vms_efficiency_cores.stdout | default('') | trim }}"

- name: Require that kind of core for VMs pinned to one
  ansible.builtin.assert:
    that: pve_vms_core_sets[hostvars[item].pve_vm.affinity] | length > 0
    fail_msg: >-
      {{ item }} wants affinity {{ hostvars[item].pve_vm.affinity }}, but
      {{ inventory_hostname }}'s CPU has no such cores; give core numbers instead
  loop: "{{ groups['vms'] }}"
  when: hostvars[item].pve_vm.affinity | default('') in ['performance', 'efficiency']

- name: Manage each VM on this node
  ansible.builtin.include_tasks: vm.yml
  loop: "{{ groups['vms'] }}"
  loop_control:
    loop_var: pve_vms_name
  vars:
    # The VMID is the last octet of the address: 10.0.1.160 -> 160.
    pve_vms_spec: >-
      {{ pve_vms_defaults
         | combine({'vmid': hostvars[pve_vms_name].ansible_host | split('.') | last})
         | combine(hostvars[pve_vms_name].pve_vm) }}
  when: pve_vms_spec.node | default(groups['proxmox'] | first) == inventory_hostname
