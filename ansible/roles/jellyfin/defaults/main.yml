---
# jellyfin/jellyfin:10.11.11 -- digest pushed 2026-06-06 15:43 UTC
jellyfin_image: jellyfin/jellyfin@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
jellyfin_dir: /opt/stacks/jellyfin
jellyfin_media_path: /srv/media
jellyfin_published_url: ""
# Service account that owns config and cache; media must be readable by it.
jellyfin_user: jellyfin
jellyfin_uid: 2000

# Which of the host's GPUs (gpu_vendors) Jellyfin transcodes on; empty means
# software transcoding. Defaults to the first one.
jellyfin_gpu_vendor: "{{ gpu_vendors[0] if gpu_vendors | length > 0 else '' }}"
# AMD/Intel: render node passed to the container, as a stable path such as
# /dev/dri/by-path/pci-0000:01:00.0-render; the container sees it as
# /dev/dri/renderD128 (Jellyfin's default). Empty exposes all of /dev/dri.
jellyfin_gpu_device: ""
# NVIDIA: all, or one GPU's UUID or index.
jellyfin_nvidia_devices: all

# First-run setup through the API, replacing the browser wizard. Runs only
# while the wizard is pending, so an existing server is never reconfigured;
# libraries and transcoding settings are reconciled on every run. Empty
# password: the setup is skipped and the wizard stays for the browser.
jellyfin_admin_user: sysadmin
jellyfin_admin_password: ""  # put a !vault value in group_vars
jellyfin_server_name: "{{ inventory_hostname }}"
jellyfin_ui_culture: en-GB
jellyfin_metadata_language: en
jellyfin_metadata_country: GB
jellyfin_remote_access: false  # LAN only; no UPnP port mapping either
# Libraries, with paths as the container sees them (jellyfin_media_path is
# mounted at /media). type: movies, tvshows, music, books, photos, ... The
# list is authoritative: libraries not in it are removed and the paths of
# existing ones follow it. Files are never touched.
jellyfin_libraries: []
#  - name: Movies
#    type: movies
#    paths: [/media/movies/action, /media/movies/comedy]
# Extra (non-admin) users, created once with the given password. Vault both
# fields so the repository does not list who uses the server.
jellyfin_users: []
#  - name: !vault |
#      ...
#    password: !vault |
#      ...
# Hardware transcoding, derived from jellyfin_gpu_vendor. Codecs the GPU can
# decode; trim for older cards (the R9 380X has no HEVC or VP9 decoder).
jellyfin_hw_decoding_codecs: [h264, hevc, mpeg2video, vc1, vp8, vp9, av1]
jellyfin_vaapi_device: /dev/dri/renderD128  # inside the container
jellyfin_api_url: http://127.0.0.1:8096
