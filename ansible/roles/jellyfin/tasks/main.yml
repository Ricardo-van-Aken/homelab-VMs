---
- name: Check the render device exists
  when: jellyfin_gpu_vendor in ['amd', 'intel']
  block:
    - name: Stat GPU device
      ansible.builtin.stat:
        path: "{{ jellyfin_gpu_device | default('/dev/dri', true) }}"
      register: jellyfin_gpu_stat

    - name: Fail early when the GPU is not usable
      ansible.builtin.assert:
        that: jellyfin_gpu_stat.stat.exists
        fail_msg: >-
          {{ jellyfin_gpu_device | default('/dev/dri', true) }} does not exist
          on {{ inventory_hostname }}.
          Check that the GPU is passed through (lspci), that its firmware is
          installed and the VM rebooted since, and that the driver bound it
          (dmesg | grep -i drm). Set jellyfin_gpu_vendor to '' for software
          transcoding.

- name: Create Jellyfin service account
  ansible.builtin.user:
    name: "{{ jellyfin_user }}"
    uid: "{{ jellyfin_uid }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create stacks directory
  ansible.builtin.file:
    path: "{{ jellyfin_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Jellyfin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_user }}"
    mode: "0750"
  loop:
    - "{{ jellyfin_dir }}"
    - "{{ jellyfin_dir }}/config"
    - "{{ jellyfin_dir }}/cache"

- name: Render compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ jellyfin_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Jellyfin stack
  community.docker.docker_compose_v2:
    project_src: "{{ jellyfin_dir }}"
    state: present
    remove_orphans: true
