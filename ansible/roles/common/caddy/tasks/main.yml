---
- name: Check the HTTPS settings
  ansible.builtin.assert:
    that:
      - caddy_acme_email | length > 0
      - caddy_dns_provider | length > 0
      - caddy_dns_plugin | length > 0
      - caddy_dns_token | length > 0
    fail_msg: >-
      caddy_https needs caddy_acme_email, caddy_dns_provider, caddy_dns_plugin
      and a !vault caddy_dns_token in group_vars
  when: caddy_https | bool

- name: Create stacks directory
  ansible.builtin.file:
    path: "{{ caddy_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ caddy_dir }}"
    - "{{ caddy_dir }}/image"
    - "{{ caddy_sites_dir }}"
    - "{{ caddy_data_dir }}"

- name: Copy the image build
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ caddy_dir }}/image/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  register: caddy_dockerfile

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Caddy

- name: Render compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ caddy_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

# Kept out of compose.yml so that file stays readable.
- name: Write the DNS token
  ansible.builtin.copy:
    content: "CADDY_DNS_TOKEN={{ caddy_dns_token }}\n"
    dest: "{{ caddy_dir }}/caddy.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Caddy

# The image is built once; again when its Dockerfile changed.
- name: Deploy Caddy stack
  community.docker.docker_compose_v2:
    project_src: "{{ caddy_dir }}"
    state: present
    build: "{{ 'always' if caddy_https | bool and caddy_dockerfile is changed else 'policy' }}"
    remove_orphans: true
    wait: true
    wait_timeout: 60
