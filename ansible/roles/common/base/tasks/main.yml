---
# A fresh clone is still running cloud-init, which updates packages on
# first boot and holds the apt lock meanwhile.
- name: Check for cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: base_cloud_init

# Exit code 2: done, with warnings it recovered from.
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  register: base_cloud_init_status
  changed_when: false
  failed_when: base_cloud_init_status.rc not in [0, 2]
  when: base_cloud_init.stat.exists

# lock_timeout: the apt-daily timers may hold the lock for a while too.
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

# The agent talks over a virtio serial port that only exists when Proxmox
# gives the VM one; untrusted VMs, a Pi and containers have none. The unit
# is static (udev-activated), so it is started, never enabled.
- name: Look for the guest agent's port
  ansible.builtin.stat:
    path: /dev/virtio-ports/org.qemu.guest_agent.0
  register: base_agent_port

- name: Set up the QEMU guest agent
  when: base_agent_port.stat.exists
  block:
    - name: Install QEMU guest agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Start QEMU guest agent
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Check the restart time
  ansible.builtin.assert:
    that: base_reboot_time | string is match('^(([01][0-9]|2[0-3]):[0-5][0-9])?$')
    fail_msg: 'base_reboot_time is "{{ base_reboot_time }}"; write it as "HH:MM", quoted, or leave it empty.'

# Always written, so an emptied setting takes effect.
- name: Set what unattended upgrades install and when they restart
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-homelab
    content: |
      Unattended-Upgrade::Origins-Pattern {
      {% for origin in base_upgrade_origins %}
        "{{ origin }}";
      {% endfor %}
      };
      Unattended-Upgrade::Automatic-Reboot "{{ 'true' if base_reboot_time else 'false' }}";
      {% if base_reboot_time %}
      Unattended-Upgrade::Automatic-Reboot-Time "{{ base_reboot_time }}";
      {% endif %}
    owner: root
    group: root
    mode: "0644"
