---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

# Only a QEMU guest has the virtio serial device the agent talks over. A Pi
# reports kvm too, as a host, since it has /dev/kvm. The unit is static
# (udev-activated), so it is started, never enabled.
- name: Set up the QEMU guest agent
  when:
    - ansible_facts.virtualization_role == 'guest'
    - ansible_facts.virtualization_type in ['kvm', 'qemu']
  block:
    - name: Install QEMU guest agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Start QEMU guest agent
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
