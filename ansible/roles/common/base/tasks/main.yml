---
# A fresh clone is still running cloud-init, which updates packages on
# first boot and holds the apt lock meanwhile.
- name: Check for cloud-init
  ansible.builtin.stat:
    path: /usr/bin/cloud-init
  register: base_cloud_init

# Exit code 2: done, with warnings it recovered from.
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  register: base_cloud_init_status
  changed_when: false
  failed_when: base_cloud_init_status.rc not in [0, 2]
  when: base_cloud_init.stat.exists

# lock_timeout: the apt-daily timers may hold the lock for a while too.
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

# Only a QEMU guest has the virtio serial device the agent talks over. A Pi
# reports kvm too, as a host, since it has /dev/kvm. The unit is static
# (udev-activated), so it is started, never enabled.
- name: Set up the QEMU guest agent
  when:
    - ansible_facts.virtualization_role == 'guest'
    - ansible_facts.virtualization_type in ['kvm', 'qemu']
  block:
    - name: Install QEMU guest agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Start QEMU guest agent
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
