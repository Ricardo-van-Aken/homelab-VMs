---
# Grafana Alloy: one agent per machine. The monitoring machine (role
# grafana) reads the machine's metrics and its programs' CPU and memory from
# it, and it sends the machine's logs there.

# https://github.com/grafana/alloy/releases
# TODO: with a new version, replace both checksums (the release lists them).
alloy_version: 1.22.0
alloy_checksum_amd64: sha256:29ca37327c02e30ff7cc3a1e0ff3779217f26092a1adc29ff4738f6a9e4370e3
alloy_checksum_arm64: sha256:860933dcdf9535b7b4503e92ae15722668e45c252be8f095a7ad1ae61fff5b8a

# Where the monitoring machine reads the metrics. Alloy's own page is on
# this port too, so the firewall lets only that machine in.
alloy_port: 9100

# Where the logs go: Loki's push address on the monitoring machine. Required.
alloy_logs_url: ""  # e.g. http://10.0.1.140:3100/loki/api/v1/push
# Sent with the logs. The monitoring machine knows which machine each token
# belongs to (grafana_tokens) and files the logs under that machine's name.
# Required: 32 characters or more, of letters, digits and . _ ~ + / = -
alloy_token: ""

# How far back the journal is read when Alloy starts: the lines a machine
# logged before it went down are sent after it is back, up to this age.
alloy_journal_max_age: 168h
