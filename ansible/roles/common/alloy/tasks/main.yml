---
- name: Check where the logs go and this machine's token
  ansible.builtin.assert:
    that:
      - alloy_logs_url | length > 0
      - alloy_token is match('^[A-Za-z0-9._~+/=-]{32,}$')
    fail_msg: >-
      set alloy_logs_url to the monitoring machine's address, and alloy_token
      to this machine's token: 32 characters or more, of letters, digits and
      . _ ~ + / = -

- name: Check there is an Alloy package for this machine
  ansible.builtin.assert:
    that: ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: >-
      Alloy is installed here for x86_64 and aarch64 only; this machine is
      {{ ansible_facts.architecture }} (a Raspberry Pi needs the 64-bit
      Raspberry Pi OS)

- name: Download Alloy
  vars:
    arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
  ansible.builtin.get_url:
    url: >-
      https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-{{ alloy_version }}-1.{{ arch }}.deb
    dest: "/var/cache/alloy-{{ alloy_version }}-1.{{ arch }}.deb"
    checksum: "{{ lookup('ansible.builtin.vars', 'alloy_checksum_' ~ arch) }}"
    owner: root
    group: root
    mode: "0644"

# The package makes the alloy user and the service.
- name: Install Alloy
  vars:
    arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
  ansible.builtin.apt:
    deb: "/var/cache/alloy-{{ alloy_version }}-1.{{ arch }}.deb"

- name: Look for Docker
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: alloy_docker

# Container logs are read through Docker's socket, which its group may use.
- name: Let Alloy read the container logs
  ansible.builtin.user:
    name: alloy
    groups: docker
    append: true
  when: alloy_docker.stat.exists
  notify: Restart Alloy

# The containers' names come from containerd, whose socket is root's alone.
# Docker's group, which may already do anything with the containers, gets
# it too: now, and after each start of containerd.
- name: Look for containerd
  ansible.builtin.stat:
    path: /run/containerd/containerd.sock
  register: alloy_containerd

- name: Let Alloy read the containers' names
  ansible.builtin.file:
    path: /run/containerd/containerd.sock
    group: docker
  when: alloy_docker.stat.exists and alloy_containerd.stat.exists
  notify: Restart Alloy

- name: Create the directory for containerd's service settings
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: alloy_docker.stat.exists and alloy_containerd.stat.exists

- name: Keep the containers' names readable after a start of containerd
  ansible.builtin.copy:
    content: |
      [Service]
      ExecStartPost=/usr/bin/chgrp docker /run/containerd/containerd.sock
    dest: /etc/systemd/system/containerd.service.d/socket-group.conf
    owner: root
    group: root
    mode: "0644"
  when: alloy_docker.stat.exists and alloy_containerd.stat.exists
  notify: Reload systemd

- name: Answer the monitoring machine on the metrics port
  ansible.builtin.lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: 'CUSTOM_ARGS="--server.http.listen-addr=0.0.0.0:{{ alloy_port }}"'
  notify: Restart Alloy

# It holds the token: readable by root and Alloy only.
- name: Write Alloy's configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
  notify: Restart Alloy
  no_log: true

- name: Start Alloy
  ansible.builtin.systemd_service:
    name: alloy
    state: started
    enabled: true

- name: Restart Alloy now when its configuration changed
  ansible.builtin.meta: flush_handlers

# systemd calls a service started that stops a moment later over a mistake
# in its configuration.
- name: Check Alloy runs with this configuration
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ alloy_port }}/-/ready"
  register: alloy_ready
  until: alloy_ready.status == 200
  retries: 10
  delay: 3
