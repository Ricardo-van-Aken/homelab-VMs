---
# Unprivileged user that owns the graphical session, Steam and Sunshine. The
# uid is fixed so a host dataset owned by it (the games share) stays owned
# by it on any VM.
desktop_user: gamer
desktop_uid: 2002
desktop_user_groups:
  - audio
  - video
  - render
  - input
  - autologin
desktop_packages:
  - xorg
  - lightdm
  - lightdm-gtk-greeter
  - openbox
  - pipewire
  - pipewire-pulse
  - wireplumber
  - x11-xserver-utils
  - xdg-utils
  - fonts-dejavu-core
desktop_session: openbox

# Force a DRM connector on when no monitor or dummy plug is attached.
# Works with any KMS driver (amdgpu, i915, nouveau); not with the NVIDIA
# proprietary driver.
desktop_force_connector: ""
desktop_force_mode: 1920x1080@60

# Pin the X server to one GPU when the host has several; empty lets Xorg pick
# the boot GPU. Bus id as in `lspci` (01:00.0) -> "PCI:1:0:0".
desktop_gpu_bus_id: ""
desktop_xorg_driver: modesetting  # amdgpu, intel or nvidia to use a vendor DDX
