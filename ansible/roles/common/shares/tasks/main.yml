---
# Mounts the host datasets listed in this VM's definition (pve_vm.shares).
# The virtiofs tag is the dataset name, as pve_vms configured it.
# No owner or mode: once mounted, the path is the dataset itself, whose
# owner and mode are set on the Proxmox host (pve_storage).
- name: Create mount points  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
  loop: "{{ shares_mounts }}"
  loop_control:
    label: "{{ item.path }}"

# nofail: a VM whose share is missing still boots and stays reachable.
- name: Mount shares
  ansible.posix.mount:
    src: "{{ item.dataset }}"
    path: "{{ item.path }}"
    fstype: virtiofs
    opts: defaults,nofail
    state: mounted
  loop: "{{ shares_mounts }}"
  loop_control:
    label: "{{ item.dataset }} -> {{ item.path }}"
