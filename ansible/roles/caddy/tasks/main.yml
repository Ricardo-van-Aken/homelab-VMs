---
- name: Create stacks directory
  ansible.builtin.file:
    path: "{{ caddy_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Caddy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ caddy_dir }}"
    - "{{ caddy_sites_dir }}"

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_dir }}/Caddyfile"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Caddy

- name: Render compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ caddy_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Caddy stack
  community.docker.docker_compose_v2:
    project_src: "{{ caddy_dir }}"
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 60
