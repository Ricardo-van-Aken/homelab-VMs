---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:

    # The instance is a container, not a QEMU guest: no agent here.
    - name: Assert base packages are installed
      ansible.builtin.assert:
        that:
          - "'unattended-upgrades' in ansible_facts.packages"
          - "'qemu-guest-agent' not in ansible_facts.packages"

    - name: Read auto-upgrades config
      ansible.builtin.slurp:
        src: /etc/apt/apt.conf.d/20auto-upgrades
      register: base_auto_upgrades

    - name: Assert unattended upgrades are on
      ansible.builtin.assert:
        that: "'Unattended-Upgrade \"1\"' in (base_auto_upgrades.content | b64decode)"

    # As apt itself reads it, from every file in apt.conf.d.
    - name: Read the unattended upgrades settings
      ansible.builtin.command: apt-config dump Unattended-Upgrade
      changed_when: false
      register: base_upgrade_settings

    - name: Assert Docker's packages are upgraded and the machine restarts at night
      ansible.builtin.assert:
        that:
          - >-
            'Unattended-Upgrade::Origins-Pattern:: "origin=Docker,label=Docker CE";'
            in base_upgrade_settings.stdout_lines
          - "'Unattended-Upgrade::Automatic-Reboot \"true\";' in base_upgrade_settings.stdout_lines"
          - "'Unattended-Upgrade::Automatic-Reboot-Time \"04:00\";' in base_upgrade_settings.stdout_lines"

    - name: Read timezone
      ansible.builtin.command: timedatectl show -p Timezone --value
      changed_when: false
      register: base_tz

    - name: Assert timezone is set
      ansible.builtin.assert:
        that: base_tz.stdout == 'Europe/Amsterdam'
