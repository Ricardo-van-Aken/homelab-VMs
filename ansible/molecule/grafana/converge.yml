---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    # The instance's facts have no network interfaces.
    - name: Read this machine's address
      ansible.builtin.command: hostname -I
      changed_when: false
      register: converge_addresses

    # This same machine twice: under its own name, where a program's own
    # metrics page is read too (Alloy's, in place of a game server's), and
    # as a machine with a token that sends nothing.
    - name: Watch this machine
      vars:
        address: "{{ converge_addresses.stdout.split() | first }}"
      ansible.builtin.set_fact:
        grafana_machines:
          - name: instance
            address: "{{ address }}"
            port: 9100
            vmid: 140
            also:
              - job: own_page
                port: 9100
          - name: other
            address: "{{ address }}"
            port: 9100
  roles:
    - grafana
    - alloy
