---
# Shared by every scenario (see .config/molecule/config.yml). The instance is
# a container: fake what the roles expect from a real VM.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Create media directories the jellyfin role expects to be mounted
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /srv/media
        - /srv/media/movies  # a mounted share on the VM

    - name: Create DRM device directory
      ansible.builtin.file:
        path: /dev/dri
        state: directory
        owner: root
        group: root
        mode: "0755"

    # No GPU here. A node with the render device's major/minor lets the gpu
    # role's check pass and Docker resolve the compose device mapping.
    - name: Create fake render device node
      ansible.builtin.command: mknod /dev/dri/renderD128 c 226 128
      args:
        creates: /dev/dri/renderD128
