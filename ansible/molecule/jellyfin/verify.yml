---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Inspect Jellyfin container
      ansible.builtin.command: docker inspect jellyfin
      changed_when: false
      register: jellyfin_inspect

    - name: Assert Jellyfin is running with GPU access
      ansible.builtin.assert:
        that:
          - jellyfin_container.State.Running
          - jellyfin_container.HostConfig.Devices | selectattr('PathOnHost', 'eq', '/dev/dri') | list | length == 1
      vars:
        jellyfin_container: "{{ (jellyfin_inspect.stdout | from_json)[0] }}"

    - name: Wait for the web UI
      ansible.builtin.uri:
        url: http://127.0.0.1:8096/health
        status_code: 200
      register: jellyfin_health
      retries: 30
      delay: 5
      until: jellyfin_health.status == 200
