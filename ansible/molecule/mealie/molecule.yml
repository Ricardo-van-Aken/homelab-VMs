---
# Inherits .config/molecule/config.yml. Docker runs inside the instance, so
# the compose stack really starts.
scenario:
  name: mealie
provisioner:
  inventory:
    group_vars:
      all:
        mealie_url: http://localhost:9925
        mealie_admin_email: admin@localhost
        mealie_admin_password: molecule-test-only
        mealie_proxy_secret: molecule-test-only-proxy
